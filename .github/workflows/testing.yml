name: HardenRunner Issue 721 Repro
on:
  workflow_dispatch:

jobs:
  block:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: prateek-stepsecurity/harden-runner@int
      with:
        egress-policy: block
        disable-sudo: true
        allowed-endpoints: >
          github.com:443
          api.github.com:443
    - name: Egress proof
      run: |
        for attempt in 1 2 3; do
          echo "--- example.com attempt $attempt"
          if curl -sS -i --max-time 8 https://example.com; then
            echo "off-allowlist host answered on attempt $attempt"
            exit 1
          fi
        done
    - name: Agent state
      if: always()
      run: |
        ls -la /home/agent || true
        cat /home/agent/agent.status || true
        tail -n 200 /home/agent/agent.log || true
        cat /etc/resolv.conf || true
        resolvectl status || true
